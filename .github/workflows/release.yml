name: release-alpha

# Build, sign, notarize and publish an AeroSpace Alpha release.
# Trigger from the Actions tab or:  gh workflow run release-alpha -f version=0.1
# With publish=false it builds an ad-hoc-signed zip as a workflow artifact and
# publishes nothing (no certificates needed).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.1 (tag becomes v0.1)'
        required: true
        type: string
      publish:
        description: 'Sign with Developer ID, notarize and publish a GitHub release'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

env:
  AEROSPACE_VERBOSE_BUILD: 1

jobs:
  release:
    name: release-alpha
    runs-on: macos-15
    steps:
      - name: Validate version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(-[A-Za-z0-9.]+)?$ ]]; then
            echo "Invalid release version: $INPUT_VERSION" >&2; exit 1
          fi
          echo "VERSION=$INPUT_VERSION" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # tags, for the upstream base in the release notes

      - name: Refuse to reuse a tag
        if: ${{ inputs.publish }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already exists" >&2; exit 1
          fi

      - run: ./.github/gh-actions-runner-xcode-select.sh
      - run: brew update && brew install bash fish xcbeautify swiftly
      - run: swiftly init --skip-install --assume-yes --verbose && swiftly install
      - run: swiftly run swift --version

      - name: Import the Developer ID certificate
        if: ${{ inputs.publish }}
        env:
          P12_BASE64: ${{ secrets.CODESIGN_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.CODESIGN_P12_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$P12_BASE64" ] || { echo "secret CODESIGN_P12_BASE64 is not set" >&2; exit 1; }
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "Identities in the imported certificate:"
          security find-identity -p codesigning "$keychain" || true
          identity="$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          [ -n "$identity" ] || { echo "no valid Developer ID Application identity in the certificate" >&2; exit 1; }
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "Using identity: $identity"

      - name: Write the notarization key
        if: ${{ inputs.publish }}
        env:
          KEY_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          [ -n "$KEY_BASE64" ] || { echo "secret NOTARY_KEY_P8_BASE64 is not set" >&2; exit 1; }
          echo "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      - name: Build, sign and notarize
        if: ${{ inputs.publish }}
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          ./script/release-alpha.sh --version "$VERSION" \
            --codesign-identity "$CODESIGN_IDENTITY" \
            --notary-key "$RUNNER_TEMP/AuthKey.p8" \
            --notary-key-id "$NOTARY_KEY_ID" \
            --notary-issuer "$NOTARY_ISSUER_ID"

      - name: Build (dry run, ad-hoc signature)
        if: ${{ !inputs.publish }}
        run: ./script/release-alpha.sh --version "$VERSION" --codesign-identity - --skip-notarize

      - name: Show the build log on failure
        if: ${{ failure() }}
        run: 'if test -f ./.release/xcodebuild.log; then tail -200 ./.release/xcodebuild.log; fi'

      - uses: actions/upload-artifact@v4
        with:
          name: AeroSpace-Alpha-v${{ env.VERSION }}
          path: .release/AeroSpace-Alpha-v${{ env.VERSION }}.zip
          if-no-files-found: error

      - name: Publish the GitHub release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$VERSION"
          zip=".release/AeroSpace-Alpha-v$version.zip"
          base="$(git describe --tags --abbrev=0 --match 'v*.*.*' 2>/dev/null || echo unknown)"  # three components: upstream tags, not Alpha's vX.Y
          sha256="$(shasum -a 256 "$zip" | cut -d' ' -f1)"
          notes="$RUNNER_TEMP/notes.md"
          cat > "$notes" <<EOF
          AeroSpace Alpha $version, built from \`${GITHUB_SHA::7}\` on upstream AeroSpace $base.

          Signed with a Developer ID and notarized by Apple. Unzip, move \`AeroSpace.app\` to Applications and \`bin/aerospace\` somewhere on your PATH. See the [README](https://github.com/${{ github.repository }}#download) for what is different from upstream, including the private API used for cross-monitor focus.

          Provided as is, without warranty of any kind, under the MIT licence. Use at your own risk.

          SHA-256: \`$sha256\`
          EOF
          git tag "v$version" "$GITHUB_SHA"
          git push origin "v$version"
          gh release create "v$version" "$zip" --title "AeroSpace Alpha $version" --notes-file "$notes"
