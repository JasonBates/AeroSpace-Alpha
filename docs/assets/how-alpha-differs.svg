<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-label="AeroSpace Alpha is upstream AeroSpace plus pending upstream fixes plus Alpha's own features">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a31"/>
      <stop offset="1" stop-color="#101024"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="640" rx="24" fill="url(#bg)"/>

  <circle cx="48" cy="46" r="6" fill="#7b86f2"/>
  <text x="66" y="52" font-size="17" letter-spacing="1.5" fill="#c8d3f8">AEROSPACE ALPHA</text>
  <text x="42" y="98" font-size="34" font-weight="600" fill="#f1f3ff">Three layers, one build</text>

  <!-- brackets -->
  <g stroke="#7b86f2" stroke-width="2" fill="none">
    <path d="M62 136 h-10 v434 h10"/>
  </g>
  <text transform="translate(44 353) rotate(-90)" text-anchor="middle" font-size="15" letter-spacing="2" fill="#c8d3f8">AEROSPACE ALPHA</text>
  <g stroke="#526087" stroke-width="2" fill="none">
    <path d="M104 456 h-10 v114 h10"/>
  </g>
  <text transform="translate(86 513) rotate(-90)" text-anchor="middle" font-size="15" letter-spacing="2" fill="#8a97c4">STOCK</text>

  <!-- top: Alpha features -->
  <rect x="124" y="136" width="1036" height="150" rx="18" fill="#343d68" stroke="#7b86f2" stroke-width="2"/>
  <text x="152" y="180" font-size="24" font-weight="600" fill="#f1f3ff">Alpha features</text>
  <text x="152" y="222" font-size="19" fill="#dfe5f2">Single-window width  ·  Focus Mode  ·  center command  ·  resize for floating windows</text>
  <text x="152" y="254" font-size="19" fill="#dfe5f2">window-closed and window-moved events  ·  hidden-window parking fix for side-by-side monitors</text>

  <!-- middle: pending upstream PRs -->
  <rect x="124" y="306" width="1036" height="130" rx="18" fill="#1e2948" stroke="#526087" stroke-width="2"/>
  <text x="152" y="350" font-size="24" font-weight="600" fill="#f1f3ff">Pending upstream fixes</text>
  <text x="152" y="388" font-size="19" fill="#c8d3f8">Ten open upstream pull requests, merged unchanged</text>
  <text x="152" y="418" font-size="19" fill="#c8d3f8">cross-monitor focus (#2179)  ·  native tabs (#2225)  ·  native full screen (#2174)  ·  crash and focus fixes</text>

  <!-- bottom: upstream -->
  <rect x="124" y="456" width="1036" height="114" rx="18" fill="#141c35" stroke="#3a4668" stroke-width="2"/>
  <text x="152" y="498" font-size="24" font-weight="600" fill="#f1f3ff">Upstream AeroSpace</text>
  <text x="152" y="536" font-size="19" fill="#c8d3f8">nikitabobko/AeroSpace main, v0.21.3-Beta  ·  the code, the docs and the config format are upstream's</text>

  <text x="124" y="612" font-size="16" fill="#8a97c4">Each layer is its own commit range. Alpha is rebased onto upstream main; nothing upstream is rewritten.</text>
</svg>
