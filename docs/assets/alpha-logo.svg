<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="AeroSpace Alpha logo: a Greek alpha on a centred window in front of dimmed tiles">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e2948"/>
      <stop offset="1" stop-color="#101024"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3660"/>
      <stop offset="1" stop-color="#1b2446"/>
    </linearGradient>
    <linearGradient id="alpha" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4e9f7"/>
      <stop offset="1" stop-color="#8b95f5"/>
