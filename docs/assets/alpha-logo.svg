  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g fill="#161e38" stroke="#3a4668" stroke-width="4">
    <rect x="64" y="96" width="120" height="320" rx="14"/>
    <rect x="328" y="96" width="120" height="150" rx="14"/>
